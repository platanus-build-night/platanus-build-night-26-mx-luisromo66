<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finite Scroll</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 18px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #12152a; color: #eef;
      }
      h1 { font-size: 1.1rem; margin: 0 0 2px; letter-spacing: .5px; }
      .sub { font-size: .76rem; opacity: .6; margin-bottom: 16px; }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; width: 100%; }
      .primary { background: #6c5ce7; color: #fff; font-weight: 600; padding: 12px 14px; margin-bottom: 12px; font-size: .92rem; }
      .primary:hover { filter: brightness(1.08); }
      .ghost { background: transparent; color: #9aa; text-decoration: none; padding: 9px; font-size: .8rem; text-align: left; }
      .ghost:hover { color: #cdd; background: #1a1f3d; }
      .row { display: flex; flex-direction: column; gap: 2px; }
    </style>
  </head>
  <body>
    <h1>🌀 Finite Scroll</h1>
    <div class="sub">Tu scroll, finito.</div>

    <button class="primary" id="openDashboard">📊 Ver dashboard (gráficas y stats)</button>

    <div class="row">
      <button class="ghost" id="testScreamer">🧪 Probar screamer (demo)</button>
      <button class="ghost" id="resetCounter">🔄 Reiniciar contador (en esta pestaña)</button>
      <button class="ghost" id="openOptions">⚙️ Metas y ajustes</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
