<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- simbolo de infinito (scroll infinito) -->
  <path d="M 64,64 C 53,45 29,45 29,64 C 29,83 53,83 64,64 C 75,45 99,45 99,64 C 99,83 75,83 64,64 Z"
        fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- corte / rayo que rompe el patron -->
  <line x1="90" y1="36" x2="40" y2="92" stroke="#0F172A" stroke-width="16" stroke-linecap="round" opacity="0.18"/>
  <line x1="90" y1="36" x2="40" y2="92" stroke="#FDE047" stroke-width="9"  stroke-linecap="round"/>
</svg>
